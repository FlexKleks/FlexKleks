name: Generate Snake & Pac-Man & Fox

on:
  schedule:
  - cron: "0 */12 * * *"
  workflow_dispatch:


jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
    - uses: Platane/snk@v3
      with:
        github_user_name: FlexKleks
        outputs: |
          dist/github-snake.svg
          dist/github-snake-dark.svg?palette=github-dark
          dist/github-pacman.svg?mode=pacman
    - uses: crazy-max/ghaction-github-pages@v3
      with:
        target_branch: output
        build_dir: dist
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fox:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Fetch random fox
      run: |
        FOX_URL=$(curl -s https://randomfox.ca/floof/ | jq -r '.image')
        curl -sL "$FOX_URL" -o fox.jpg
    - name: Commit fox
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add fox.jpg
        git diff --staged --quiet || git commit -m "chore: update fox of the day"
        git push
